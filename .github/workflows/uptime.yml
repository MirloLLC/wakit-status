name: Uptime CI
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: upptime/uptime-monitor@v1.41.3
        with:
          token: ${{ secrets.GH_PAT }}
