owner: MirloLLC
repo: wakit-status

sites:
  - name: Dashboard
    url: https://app.wakit.ai
    icon: https://app.wakit.ai/favicon.svg

  - name: API
    url: https://api.wakit.ai/functions/v1/api/ping
    icon: https://app.wakit.ai/favicon.svg

  - name: Auth
    url: https://api.wakit.ai/auth/v1/health
    icon: https://app.wakit.ai/favicon.svg

  - name: Meta WhatsApp API
    url: https://graph.facebook.com/v24.0/
    expectedStatusCodes:
      - 400

  - name: Documentation
    url: https://docs.wakit.ai
    icon: https://app.wakit.ai/favicon.svg

status-website:
  cname: status.wakit.ai
  logoUrl: https://app.wakit.ai/favicon.svg
  name: wakit status
  introTitle: "**wakit** platform status"
  introMessage: Current status and uptime for wakit services. [Learn more about wakit](https://wakit.ai).
  navbar:
    - title: wakit
      href: https://wakit.ai
    - title: Dashboard
      href: https://app.wakit.ai
    - title: Docs
      href: https://docs.wakit.ai/docs
  theme: light
  css: |
    :root {
      --font-family: 'Geist', -apple-system, sans-serif;
      --body-background-color: #FAF7F2;
      --body-color: #1F262C;
      --nav-background-color: #1F262C;
      --nav-color: #FAF7F2;
      --status-up-color: #22c55e;
      --status-down-color: #ef4444;
      --link-color: #1F262C;
    }
    body { font-family: var(--font-family); }
    nav { background: #1F262C !important; }
    nav a { color: #FAF7F2 !important; }
    .main-header h1 { font-weight: 800; letter-spacing: -0.05em; }

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  uptime: "*/15 * * * *"

i18n:
  activeIncidents: Active incidents
  allSystemsOperational: All systems operational
  incidentReport: "Incident report for $SITE_NAME"
  activeIncidentSummary: "Opened $DATE"
  incidentFixed: Fixed
  incidentOngoing: Ongoing
  incidentDetails: Incident details
  uptimeHistory: Uptime history
  responseTimeHistory: Response time history
  liveStatus: Live status
  overallUptime: "Overall uptime: $UPTIME"
